name: Deploy strony (SFTP)

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: sftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SFTP_HOST: ${{ secrets.FTP_SERVER }}
      SFTP_USER: ${{ secrets.FTP_USERNAME }}
      SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
      SFTP_PORT: ${{ secrets.FTP_PORT || 22 }}
      REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR || '.' }}
    steps:
      - uses: actions/checkout@v4

      - name: Zainstaluj lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Diagnostyka logowania (tymczasowa, bez ujawniania danych)
        continue-on-error: true
        run: |
          echo "dlugosc loginu: ${#SFTP_USER}, dlugosc hasla: ${#SFTP_PASS}, port: $SFTP_PORT"
          case "$SFTP_USER$SFTP_PASS$SFTP_HOST" in *[[:space:]]*) echo "UWAGA: w sekretach jest biały znak";; *) echo "brak białych znaków w sekretach";; esac
          case "$SFTP_HOST" in *://*|*/*) echo "UWAGA: FTP_SERVER zawiera protokol lub sciezke";; *) echo "format hosta OK";; esac
          ssh -p "$SFTP_PORT" -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=none -o ConnectTimeout=15 "$SFTP_USER@$SFTP_HOST" true 2>&1 | sed "s/$SFTP_HOST/HOST/g; s/$SFTP_USER/USER/g" | tail -5

      - name: Wgraj site/ przez SFTP (bez usuwania plików na serwerze)
        run: |
          lftp -u "$SFTP_USER,$SFTP_PASS" -p "$SFTP_PORT" "sftp://$SFTP_HOST" <<LFTP
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          mirror -R --verbose --parallel=3 ./site/ "$REMOTE_DIR"
          bye
          LFTP
# ponowna próba po poprawie sekretów
