name: Deploy strony (FTP)

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.FTP_SERVER }}
      FTP_USER: ${{ secrets.FTP_USERNAME }}
      FTP_PASS: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ secrets.FTP_PORT || 21 }}
      REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR || '.' }}
    steps:
      - uses: actions/checkout@v4

      - name: Zainstaluj lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Wgraj site/ przez FTP (z szyfrowaniem TLS, jeśli serwer je oferuje; bez usuwania plików na serwerze)
        run: |
          lftp -u "$FTP_USER,$FTP_PASS" -p "$FTP_PORT" "ftp://$FTP_HOST" <<LFTP
          set ftp:ssl-allow yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate no
          set ftp:passive-mode yes
          set net:max-retries 2
          set net:timeout 20
          mirror -R --verbose --parallel=3 ./site/ "$REMOTE_DIR"
          bye
          LFTP
# ponowna próba po poprawie loginu
